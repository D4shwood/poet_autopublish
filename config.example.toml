# Copy to ~/.config/poetautopublish/config.toml (created automatically on first run).

# Folder with your poem files (no extension or .txt).
poems_dir = "~/poetry"
# Where the PDFs are written. Keep it outside poems_dir.
out_dir = "~/poetry_published"
# Optional folder that gets a copy of every PDF (e.g. a Syncthing folder). "" = off.
mirror_dir = ""
# Only poems signed with exactly this name are published.
author = "Your Name"
# The name of your series / journal, printed on every cover.
series = "Contra Noir"
# "auto" picks Turkish if most poems are Turkish, else English. Or "tr" / "en".
lang = "auto"
# Poems signed before this time belong to the previous day.
night_cutoff = "05:00"
# Draft-history snapshots kept per poem.
history_keep = 50
# Program that opens PDFs with `o` ("" = the desktop default via xdg-open),
# e.g. "okular", "evince" or "firefox".
pdf_viewer = ""
# Keep the poems folder in step with its git remote (e.g. a private GitHub
# repo) from the background service: poems written elsewhere arrive and get
# built, and the PDFs are pushed to the remote's `pdf` branch.
sync = false
# Show each line's syllables and rhyme beside it while writing, and the meter
# in the status line (also Ctrl+E in the writer).
prosody = false
# End the full book with a Variants chapter: each revised poem from its first
# full draft to its final form, removed words struck out, added ones underlined.
variants = false
