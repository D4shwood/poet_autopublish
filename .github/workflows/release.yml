name: Release

# Pushing a tag like v0.1.0 or v0.2.0-beta.1 builds the Linux archive, the
# Windows installer and the Windows zip, and publishes them as a GitHub
# release; tags with a "-" become pre-releases. Run by hand (workflow_dispatch)
# it only builds them, as downloadable artifacts, without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # The tag, or "dev" for a run by hand.
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release --locked
      - name: Package
        run: |
          name=poetautopublish-${VERSION}-x86_64-linux
          mkdir "$name"
          cp target/release/poetautopublish README.md README.tr.md \
             config.example.toml "$name"/
          cp -r templates examples "$name"/
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: poetautopublish-*.tar.gz

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release --locked
      - name: Gather the files
        shell: pwsh
        run: |
          $dir = "poetautopublish-$env:VERSION-windows"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item target/release/poetautopublish.exe, packaging/windows/poet.cmd, `
                    README.md, README.tr.md, config.example.toml $dir
          Copy-Item -Recurse templates, examples $dir
      - name: Portable zip
        shell: pwsh
        run: |
          $dir = "poetautopublish-$env:VERSION-windows"
          # 7-Zip stores the names as UTF-8, so "Örnek Şiir" stays readable.
          7z a -tzip -mcu=on "$dir-portable.zip" $dir | Out-Null
      - name: Installer
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress | Out-Null
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          # Inno wants a plain dotted version; a tag like v0.2.0-beta.1 gives 0.2.0.
          $v = ($env:VERSION -replace '^v', '') -replace '-.*$', ''
          if ($v -notmatch '^\d+(\.\d+)*$') { $v = '0.0.0' }
          $src = (Resolve-Path "poetautopublish-$env:VERSION-windows").Path
          iscc /Qp "/DAppVersion=$v" "/DSourceDir=$src" packaging/windows/poetautopublish.iss
          Move-Item packaging/windows/poetautopublish-setup.exe "poetautopublish-$env:VERSION-windows-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            poetautopublish-*-portable.zip
            poetautopublish-*-setup.exe

  publish:
    if: github.ref_type == 'tag'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          pre=""
          case "$VERSION" in *-*) pre="--prerelease" ;; esac
          gh release create "$VERSION" $pre --verify-tag \
            --title "$VERSION" --notes-file ../RELEASE_NOTES.md *
