name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The shared core alone, as the phone app builds it.
      - run: cargo clippy --lib --no-default-features -- -D warnings
      - run: cargo test
      # The Windows binary, so a broken build shows up here before a release.
      - if: runner.os == 'Windows'
        run: cargo build --release --locked
      - if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: poetautopublish-windows
          path: target/release/poetautopublish.exe
